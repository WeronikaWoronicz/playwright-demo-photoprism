name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  e2e:
    name: 🔬 E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      photoprism:
        image: photoprism/photoprism:latest
        env:
          PHOTOPRISM_DATABASE_DRIVER: sqlite
          PHOTOPRISM_ADMIN_USER: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_ADMIN_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}
        ports:
          - 2342:2342
        options: >-
          --health-cmd "curl -f http://localhost:2342/api/v1/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          BASE_URL: http://localhost:2342
          PHOTOPRISM_USERNAME: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}

      - name: Upload HTML report
        id: report-upload
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Add PR comment with report link
        if: github.event_name == 'pull_request' && !cancelled()
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: playwright_report
          message: |
            ### 🎭 Playwright Report
            **Status:** ${{ job.status }}
            [📄 Download Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.report-upload.outputs.artifact-id }})

  snapshots:
    name: 📷 Refresh Snapshots
    if: contains(github.event.pull_request.labels.*.name, 'visual-update')
    timeout-minutes: 60
    runs-on: ubuntu-latest
    services:
      photoprism:
        image: photoprism/photoprism:latest
        env:
          PHOTOPRISM_DATABASE_DRIVER: sqlite
          PHOTOPRISM_ADMIN_USER: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_ADMIN_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}
        ports:
          - 2342:2342
        options: >-
          --health-cmd "curl -f http://localhost:2342/api/v1/status || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Regenerate snapshots
        run: pnpm exec playwright test --update-snapshots
        env:
          BASE_URL: http://localhost:2342
          PHOTOPRISM_USERNAME: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}

      - name: Commit snapshot changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all "**/*.png" || true
          if git diff --staged --quiet; then
            echo "No snapshots to update"
          else
            git commit -m "chore: update playwright snapshots"
            git push
          fi

  label-cleanup:
    name: 🏷️ Remove Label
    needs: snapshots
    if: always() && contains(github.event.pull_request.labels.*.name, 'visual-update')
    runs-on: ubuntu-latest
    steps:
      - name: Remove visual-update label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: visual-update
