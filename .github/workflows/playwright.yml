name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, labeled, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  e2e:
    name: 🔬 E2E Tests
    if: ${{ !(github.event.action == 'labeled' && github.event.label.name == 'visual-update') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build patched PhotoPrism image
        run: docker build -f sut/photoprism.Dockerfile -t photoprism-patched .

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright dependencies (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          PLAYWRIGHT_DOCKER_WORKERS: 'true'
          WORKER_COUNT: '4'
          PHOTOPRISM_ADMIN_USER: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_ADMIN_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}
          PHOTOPRISM_USERNAME: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}

      - name: Upload HTML report
        id: report-upload
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore

      - name: Add PR comment with report link
        if: github.event_name == 'pull_request' && !cancelled()
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: playwright_report
          message: |
            ### 🎭 Playwright Report
            **Status:** ${{ job.status }}
            [📄 Download Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.report-upload.outputs.artifact-id }})

  snapshots:
    name: 📷 Refresh Snapshots
    if: github.event.action == 'labeled' && github.event.label.name == 'visual-update'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Build patched PhotoPrism image
        run: docker build -f sut/photoprism.Dockerfile -t photoprism-patched .
      - name: Start PhotoPrism
        run: docker run -d --name photoprism -p 2342:2342 -e PHOTOPRISM_DATABASE_DRIVER=sqlite -e PHOTOPRISM_ADMIN_USER=${{ secrets.PHOTOPRISM_USERNAME }} -e PHOTOPRISM_ADMIN_PASSWORD=${{ secrets.PHOTOPRISM_PASSWORD }} photoprism-patched
      - name: Wait for PhotoPrism to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:2342/api/v1/status > /dev/null 2>&1; then
              echo 'PhotoPrism is ready'
              exit 0
            fi
            echo "Attempt $i/30: PhotoPrism not ready yet, waiting..."
            sleep 10
          done
          echo 'PhotoPrism failed to start'
          exit 1

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Regenerate snapshots
        run: pnpm exec playwright test --update-snapshots
        env:
          BASE_URL: http://localhost:2342
          WORKER_COUNT: '1'
          PHOTOPRISM_USERNAME: ${{ secrets.PHOTOPRISM_USERNAME }}
          PHOTOPRISM_PASSWORD: ${{ secrets.PHOTOPRISM_PASSWORD }}

      - name: Commit snapshot changes
        id: commit-snapshots
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add test-assets/snapshots/ || true
          if git diff --staged --quiet; then
            echo "No snapshots to update"
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: update playwright snapshots"
            git push
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Re-trigger e2e with updated snapshots
        if: steps.commit-snapshots.outputs.updated == 'true'
        run: gh workflow run "Playwright Tests" --ref "${{ github.event.pull_request.head.ref }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label-cleanup:
    name: 🏷️ Remove Label
    needs: snapshots
    if: always() && github.event.action == 'labeled' && github.event.label.name == 'visual-update'
    runs-on: ubuntu-latest
    steps:
      - name: Remove visual-update label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: visual-update
