services:
  photoprism:
    image: photoprism-patched
    stop_grace_period: 10s
    depends_on:
      - mariadb
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    ports:
      - '${WORKER_PORT}:2342'
    environment:
      PHOTOPRISM_ADMIN_USER: '${PHOTOPRISM_ADMIN_USER:-admin}'
      PHOTOPRISM_ADMIN_PASSWORD: '${PHOTOPRISM_ADMIN_PASSWORD:-insecure}'
      PHOTOPRISM_AUTH_MODE: 'password'
      PHOTOPRISM_SITE_URL: 'http://localhost:${WORKER_PORT}/'
      PHOTOPRISM_DISABLE_TLS: 'true'
      PHOTOPRISM_DEFAULT_TLS: 'false'
      PHOTOPRISM_ORIGINALS_LIMIT: 5000
      PHOTOPRISM_HTTP_COMPRESSION: 'gzip'
      PHOTOPRISM_LOG_LEVEL: 'info'
      PHOTOPRISM_READONLY: 'false'
      PHOTOPRISM_EXPERIMENTAL: 'false'
      PHOTOPRISM_DISABLE_CHOWN: 'false'
      PHOTOPRISM_DISABLE_WEBDAV: 'false'
      PHOTOPRISM_DISABLE_SETTINGS: 'false'
      PHOTOPRISM_DISABLE_TENSORFLOW: 'true'
      PHOTOPRISM_DISABLE_FACES: 'true'
      PHOTOPRISM_DISABLE_CLASSIFICATION: 'true'
      PHOTOPRISM_DISABLE_VECTORS: 'false'
      PHOTOPRISM_DISABLE_RAW: 'false'
      PHOTOPRISM_RAW_PRESETS: 'false'
      PHOTOPRISM_JPEG_QUALITY: 85
      PHOTOPRISM_DETECT_NSFW: 'false'
      PHOTOPRISM_UPLOAD_NSFW: 'true'
      PHOTOPRISM_DATABASE_DRIVER: 'mysql'
      PHOTOPRISM_DATABASE_SERVER: 'mariadb:3306'
      PHOTOPRISM_DATABASE_NAME: 'photoprism'
      PHOTOPRISM_DATABASE_USER: 'photoprism'
      PHOTOPRISM_DATABASE_PASSWORD: 'insecure'
      PHOTOPRISM_SITE_CAPTION: 'AI-Powered Photos App'
      PHOTOPRISM_SITE_DESCRIPTION: ''
      PHOTOPRISM_SITE_AUTHOR: ''
    working_dir: '/photoprism'
    volumes:
      - './originals-worker-${WORKER_INDEX}:/photoprism/originals'
      - './storage-worker-${WORKER_INDEX}:/photoprism/storage'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:2342/api/v1/status']
      interval: 10s
      timeout: 5s
      retries: 12

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    stop_grace_period: 5s
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command: --innodb-buffer-pool-size=128M --transaction-isolation=READ-COMMITTED --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=512 --innodb-rollback-on-timeout=OFF --innodb-lock-wait-timeout=120
    volumes:
      - './database-worker-${WORKER_INDEX}:/var/lib/mysql'
    environment:
      MARIADB_AUTO_UPGRADE: '1'
      MARIADB_INITDB_SKIP_TZINFO: '1'
      MARIADB_DATABASE: 'photoprism'
      MARIADB_USER: 'photoprism'
      MARIADB_PASSWORD: 'insecure'
      MARIADB_ROOT_PASSWORD: 'insecure'
